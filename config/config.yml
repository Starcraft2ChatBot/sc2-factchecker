# SC2 Lobby Fact-Checker — main config
# Edit this file, then run: start.bat   or   python main.py

# ====================== LLM ======================
llm:
  provider: "gemini"              # gemini | openai | ollama | openrouter
  api_key: "YOUR_API_KEY"
  model: "gemini-2.0-flash"
  temperature: 0.3
  max_output_tokens: 120          # short correction + full source URL
  base_url: null                  # set for ollama/openrouter/openai-compatible
  think: false
  request_timeout_sec: 60
  connect_timeout_sec: 10
  health_timeout_sec: 10
  fail_cooldown_sec: 45

# Used when provider is gemini (optional if llm.api_key is set)
gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  temperature: 0.3
  max_output_tokens: 120

# ====================== OWNER ======================
owner:
  names:
    - "YourBattleTag"
    - "YourInGameName"
  command_prefix: "!"

# ====================== FACT-CHECKER PERSONA ======================
personality:
  aggressiveness: 2
  response_length: "short"
  emoji_intensity: 0
  sc2_reference_level: 0
  topics:
    politics: true
    current_events: true
    in_game_strategy: false
    memes: false
    personal: false
  custom_enabled: true
  custom_prompt: |
    You are a precise fact-checker in a StarCraft 2 multiplayer lobby chat.
    Your only job is to correct false or misleading factual claims.
    OCR may garble text; interpret charitably but never invent meaning.
    Reply in lowercase casual chat style, max two short lines, no markdown, no emojis.
    When correcting:
      - clearly say the claim is wrong / false / not accurate / mixed
      - state what actually happened or the correct fact in one short clause
      - ALWAYS include the full real URL from the research brief (PRIMARY_SOURCE_URL)
      - example: "thats false. [correction]. https://www.reuters.com/..."
      - Copy the URL exactly. Never invent or alter a link.
    Do not echo the player's full message.
    Do not attack the person — only the claim.
    Evaluate on evidence only. Pure opinions are not fact-checked.
    NEVER invent sources, links, stats, dates, or quotes.
    If evidence is weak or missing, say unverified — do not bluff.

# ====================== RESEARCH ======================
research:
  enabled: true
  timeout_sec: 12
  max_chars: 1400
  cache_ttl_sec: 600
  max_claims: 3
  min_score: 1.5                 # lower = research more often
  require_url: true              # only keep sources with a real http(s) link
  prefer_domains: []             # optional e.g. [".gov", "reuters.com"]
  trigger_substrings:
    - "prove it"
    - "source"
    - "studies show"
    - "research shows"
    - "scientists say"
    - "fact is"
    - "the truth is"
    - "in reality"
    - "actually"
    - "according to"
    - "look it up"
    - "google it"
    - "fact check"
    - "citation"
    - "debunked"
    - "misinformation"
    - "fake news"
    - "everyone knows"
    - "its a fact"
    - "it's a fact"

# ====================== FACTCHECK POLICY ======================
factcheck:
  enabled: true
  include_full_urls: true
  reply_on_unverified: true      # false = silence when no good sources
  min_confidence_to_call_false: "medium"

# ====================== REPLY / ANTI-SPAM ======================
behaviour:
  min_reply_delay_sec: 0.4
  max_reply_delay_sec: 1.0
  reply_probability: 0.25        # low — stay quiet unless correcting
  ignore_self: true
  ignore_system: true
  address_by_name: true
  address_by_name_chance: 0.2
  name_separator: ", "

anti_spam:
  global_cooldown_sec: 4
  per_player_cooldown_sec: 12
  max_replies_per_player_per_minute: 4
  mute_list: []

memory:
  max_messages_per_player: 20
  persist_path: "logs/memory.json"

# OCR / unicode cleanup
blacklist:
  case_sensitive: false
  words: []
  symbols:
    - "—"
  letters: []
  substrings: []
  replacements:
    "—": "-"

logging:
  level: "INFO"
  file: "logs/sc2_factchecker.log"
  console: true

# ====================== CHAT BACKEND (required) ======================
# simulated  = test in console without SC2
# sc2_stub   = live OCR of SC2 window + keyboard/paste send
chat_backend: "simulated"

sc2_stub:
  window_title: "StarCraft II"
  chat_key: "enter"
  send_key: "enter"
  input_method: "paste"          # paste | type
  ocr_enabled: false             # true when using live OCR
  poll_interval_sec: 0.45
  chat_region: null              # [left, top, width, height] from measure_chat_region.py
  tesseract_cmd: null            # path to tesseract.exe if not on PATH
  switch_channels: false
  channel_switch_key: "tab"
  assume_chat_opens_on_tab: 1
  max_chat_tabs: 8
  self_name: "YourInGameName"    # your in-game name (skip own messages)
