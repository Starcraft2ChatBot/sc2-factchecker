# ====================== AI / LLM ======================
llm:
  provider: "gemini"          # gemini | openai | ollama | openrouter | ...
  api_key: "YOUR_API_KEY"
  model: "gemini-2.0-flash"
  temperature: 0.3            # low for precise fact-checking
  max_output_tokens: 120       # room for short reply + full URL
  base_url: null
  think: false
  request_timeout_sec: 60
  connect_timeout_sec: 10
  health_timeout_sec: 10
  fail_cooldown_sec: 45

gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  temperature: 0.3
  max_output_tokens: 120

owner:
  names:
    - "YourBattleTag"
    - "YourInGameName"
  command_prefix: "!"

# ====================== FACT-CHECKER (this bot only) ======================
personality:
  aggressiveness: 2
  political_mode: "factchecker"
  response_length: "short"
  emoji_intensity: 0
  sc2_reference_level: 0
  topics:
    politics: true
    current_events: true
    in_game_strategy: false
    memes: false
    personal: false
  custom_enabled: true
  custom_prompt: |
    You are a precise fact-checker in a StarCraft 2 multiplayer lobby chat.
    Your only job is to correct false or misleading factual claims.
    OCR may garble text; interpret charitably but never invent meaning.
    Reply in lowercase casual chat style, max two short lines, no markdown, no emojis.
    When correcting:
      - clearly say the claim is wrong / false / not accurate / mixed
      - state what actually happened or the correct fact in one short clause
      - ALWAYS include the full real URL from the research brief (PRIMARY_SOURCE_URL)
      - example: "thats false. [correction]. https://www.reuters.com/..."
      - example: "mixed evidence — [nuance]. https://apnews.com/..."
      - Copy the URL exactly. Never invent or alter a link.
    Do not echo the player's full message.
    Do not attack the person — only the claim.
    Evaluate on evidence only (politics, science, history, news — all fair game as claims).
    Pure opinions or feelings are not fact-checked.
    NEVER invent sources, links, stats, dates, or quotes.
    If evidence is weak or missing, say unverified — do not bluff.
    If the research brief says the claim is supported, you may stay silent or briefly confirm; prefer correcting false claims.

# ====================== RESEARCH (multi-source, strong) ======================
research:
  enabled: true
  timeout_sec: 12
  max_chars: 1400
  cache_ttl_sec: 600
  max_claims: 3
  min_score: 1.5
  require_url: true          # only keep sources that have a real http(s) link
  prefer_domains: []
  trigger_substrings:
    - "prove it"
    - "source"
    - "studies show"
    - "fact is"
    - "actually"
    - "according to"
    - "look it up"
    - "fact check"
    - "citation"
    - "debunked"
    - "misinformation"

factcheck:
  enabled: true
  include_full_urls: true
  reply_on_unverified: true
  min_confidence_to_call_false: "medium"

blacklist:
  case_sensitive: false
  words: []
  symbols:
    - "—"
  letters: []
  substrings: []
  replacements:
    "—": "-"

favorites:
  intensity: medium
  words: []

behaviour:
  min_reply_delay_sec: 0.4
  max_reply_delay_sec: 1.0
  typo_chance: 0.0
  reply_probability: 0.25
  ignore_self: true
  ignore_system: true
  reply_to_game_requests: false
  game_request_use_canned: false
  address_by_name: true
  address_by_name_chance: 0.25
  name_separator: ", "

anti_spam:
  global_cooldown_sec: 4
  per_player_cooldown_sec: 12
  max_replies_per_player_per_minute: 4
  mute_list: []

memory:
  max_messages_per_player: 20
  persist_path: "logs/memory.json"

triggers: []
canned_blocks: []

logging:
  level: "INFO"
  file: "logs/sc2_factchecker.log"
  console: true

chat_backend: "simulated"

sc2_stub:
  window_title: "StarCraft II"
  chat_key: "enter"
  send_key: "enter"
  input_method: "paste"
  ocr_enabled: false
  poll_interval_sec: 0.45
  chat_region: null
  tesseract_cmd: null
  switch_channels: false
  channel_switch_key: "tab"
  assume_chat_opens_on_tab: 1
  max_chat_tabs: 8
  self_name: "YourInGameName"
